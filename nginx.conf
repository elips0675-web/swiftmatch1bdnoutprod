upstream swiftmatch_api {
  server 127.0.0.1:3002;
}

server {
  listen 80;
  server_name swiftmatch.app;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name swiftmatch.app;

  ssl_certificate     /etc/ssl/certs/swiftmatch.crt;
  ssl_certificate_key /etc/ssl/private/swiftmatch.key;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;

  root /var/www/swiftmatch/dist;
  index index.html;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript image/svg+xml;
  gzip_min_length 256;

  # Security headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Static files (with aggressive cache)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location /uploads/ {
    proxy_pass http://swiftmatch_api;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
    expires -1;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # API proxy
  location /api/ {
    proxy_pass http://swiftmatch_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
  }

  # Socket.IO
  location /socket.io/ {
    proxy_pass http://swiftmatch_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  access_log /var/log/nginx/swiftmatch_access.log;
  error_log  /var/log/nginx/swiftmatch_error.log;
}
