services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: swiftmatch1bd
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/mysql_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/demo_data.sql:/docker-entrypoint-initdb.d/02-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3002:3002"
    mem_limit: 512m
    environment:
      PORT: 3002
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: swiftmatch1bd
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      NODE_ENV: production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data: